
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101114">
<title>Poker Grind Chart</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101114;
  color: #f2f2f2;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 24px 12px 18px;
}

header h1 {
  font-size: 22px;
  margin: 0;
  letter-spacing: 1px;
}

header p {
  color: #999;
  margin: 7px 0 0;
  font-size: 13px;
}

.container {
  padding: 12px;
  max-width: 700px;
  margin: auto;
}

select {
  width: 100%;
  padding: 16px;
  background: #24242a;
  color: white;
  border: 1px solid #393940;
  border-radius: 12px;
  font-size: 17px;
  margin: 12px 0 18px;
}

.title {
  text-align: center;
  font-size: 24px;
  font-weight: bold;
  margin: 16px 0 20px;
}

.chart {
  width: 100%;
  aspect-ratio: 1.25 / 1;
  background-image: url("charts_sprite.jpg");
  background-size: 400% 300%;
  background-repeat: no-repeat;
  border-radius: 12px;
  border: 1px solid #333;
  overflow: hidden;
}

.navigation {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}

button {
  flex: 1;
  padding: 17px 8px;
  background: #292930;
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: bold;
}

button:active {
  background: #45454c;
}

.footer {
  text-align: center;
  color: #666;
  font-size: 11px;
  padding: 25px 10px;
}
</style>
</head>

<body>

<header>
  <h1>POKER GRIND CHART</h1>
  <p>2nd ACT vs REG</p>
</header>

<div class="container">

<select id="chartSelect"></select>

<div class="title" id="chartTitle"></div>

<div class="chart" id="chart"></div>

<div class="navigation">
  <button onclick="previousChart()">◀ Anterior</button>
  <button onclick="nextChart()">Próximo ▶</button>
</div>

</div>

<div class="footer">
  OFFLINE • POKER GRIND CHART
</div>

<script>
const charts = [
  {name:"BB x SB", col:0, row:0},
  {name:"BB x BTN", col:1, row:0},
  {name:"BB x CO", col:2, row:0},
  {name:"BB x HJ", col:3, row:0},

  {name:"BB x UTG", col:0, row:1},
  {name:"SB x BTN", col:1, row:1},
  {name:"SB x CO", col:2, row:1},
  {name:"SB x HJ", col:3, row:1},

  {name:"SB x UTG", col:0, row:2},
  {name:"BTN x CO", col:1, row:2},
  {name:"IP x HJ", col:2, row:2},
  {name:"IP x UTG", col:3, row:2}
];

let current = 0;

const select = document.getElementById("chartSelect");
const chart = document.getElementById("chart");
const title = document.getElementById("chartTitle");

charts.forEach((item, index) => {
  const option = document.createElement("option");
  option.value = index;
  option.textContent = item.name;
  select.appendChild(option);
});

function updateChart() {
  const item = charts[current];

  select.value = current;
  title.textContent = item.name;

  const x = item.col * 100 / 3;
  const y = item.row * 100 / 2;

  chart.style.backgroundPosition = `${x}% ${y}%`;
}

function previousChart() {
  current = (current - 1 + charts.length) % charts.length;
  updateChart();
}

function nextChart() {
  current = (current + 1) % charts.length;
  updateChart();
}

select.addEventListener("change", function() {
  current = Number(this.value);
  updateChart();
});

updateChart();
</script>

</body>
</html>
