<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101114">
<title>Poker Grind Chart</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101114;
  color: #f2f2f2;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 18px 10px 12px;
}

header h1 {
  margin: 0;
  font-size: 20px;
  letter-spacing: 1px;
}

header p {
  margin: 6px 0 0;
  color: #92929b;
  font-size: 12px;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 10px;
}

/* RANGE */

.range-title {
  text-align: center;
  font-weight: bold;
  font-size: 21px;
  margin: 12px 0;
}

.chart {
  width: 100%;
  aspect-ratio: 1.25 / 1;
  background-image: url("charts_sprite.jpg");
  background-size: 400% 300%;
  background-repeat: no-repeat;
  background-position: 0% 0%;
  border: 1px solid #333;
  border-radius: 10px;
}

.status {
  text-align: center;
  font-size: 13px;
  color: #a5a5ae;
  margin: 12px 0 6px;
  min-height: 20px;
}

/* TABLE */

.table-title {
  text-align: center;
  margin: 25px 0 8px;
  font-size: 18px;
  font-weight: bold;
}

.instructions {
  text-align: center;
  color: #8d8d96;
  font-size: 12px;
  margin-bottom: 10px;
}

/* POKER TABLE */

.poker-table {
  position: relative;
  width: 100%;
  height: 340px;
  margin: 0 auto;
}

.table-oval {
  position: absolute;
  left: 13%;
  right: 13%;
  top: 17%;
  bottom: 17%;
  border-radius: 50%;
  background: radial-gradient(ellipse, #225a48, #123a30);
  border: 7px solid #45342b;
  box-shadow:
    inset 0 0 0 3px #102a23,
    0 5px 15px #0008;
}

.table-center {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  color: #c5d9ce;
  text-align: center;
  font-size: 13px;
  font-weight: bold;
  line-height: 1.5;
}

/* SEATS */

.seat {
  position: absolute;
  width: 65px;
  height: 65px;
  border-radius: 50%;
  background: #292930;
  border: 2px solid #505058;
  color: #f3f3f3;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  z-index: 2;
  cursor: pointer;
  box-shadow: 0 4px 8px #0007;
}

.seat small {
  font-size: 10px;
  font-weight: normal;
  margin-top: 3px;
  color: #aaa;
}

.seat.hero {
  background: #7d36a8;
  border-color: #d18aff;
  box-shadow: 0 0 15px #a94be477;
}

.seat.villain {
  background: #b45a23;
  border-color: #ffb47a;
  box-shadow: 0 0 15px #f08a4577;
}

.seat.hero small,
.seat.villain small {
  color: white;
}

/* POSITIONS */

.seat-utg {
  top: 0;
  left: 50%;
  transform: translateX(-50%);
}

.seat-hj {
  top: 14%;
  right: 5%;
}

.seat-co {
  bottom: 14%;
  right: 5%;
}

.seat-btn {
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
}

.seat-sb {
  bottom: 14%;
  left: 5%;
}

.seat-bb {
  top: 14%;
  left: 5%;
}

/* BUTTONS */

.controls {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

button.action {
  flex: 1;
  border: none;
  border-radius: 12px;
  padding: 15px 8px;
  background: #292930;
  color: white;
  font-size: 15px;
  font-weight: bold;
}

button.action:active {
  background: #45454c;
}

.clear {
  background: #3a3030 !important;
}

/* FOOTER */

.footer {
  text-align: center;
  color: #666;
  font-size: 11px;
  padding: 20px 8px;
}

/* MOBILE */

@media (max-width: 380px) {
  .poker-table {
    height: 300px;
  }

  .seat {
    width: 58px;
    height: 58px;
    font-size: 13px;
  }

  .seat small {
    font-size: 9px;
  }
}
</style>
</head>

<body>


<div class="container">


  <div class="chart" id="chart"></div>

  <div class="status" id="status">
    Toque primeiro na posição Hero
  </div>


  <div class="instructions">
    1º toque: Hero · 2º toque: Vilão
  </div>

  <div class="poker-table">

    <div class="table-oval"></div>

    <div class="table-center" id="tableCenter">
      SELECIONE<br>
      HERO E VILÃO
    </div>

    <button class="seat seat-utg" data-seat="UTG">
      UTG
      <small></small>
    </button>

    <button class="seat seat-hj" data-seat="HJ">
      HJ
      <small></small>
    </button>

    <button class="seat seat-co" data-seat="CO">
      CO
      <small></small>
    </button>

    <button class="seat seat-btn" data-seat="BTN">
      BTN
      <small></small>
    </button>

    <button class="seat seat-sb" data-seat="SB">
      SB
      <small></small>
    </button>

    <button class="seat seat-bb" data-seat="BB">
      BB
      <small></small>
    </button>

  </div>

  

</div>

<div class="footer">
  OFFLINE • POKER GRIND CHART
</div>

<script>

const charts = [
  {name:"BB x SB", col:0, row:0},
  {name:"BB x BTN", col:1, row:0},
  {name:"BB x CO", col:2, row:0},
  {name:"BB x HJ", col:3, row:0},

  {name:"BB x UTG", col:0, row:1},
  {name:"SB x BTN", col:1, row:1},
  {name:"SB x CO", col:2, row:1},
  {name:"SB x HJ", col:3, row:1},

  {name:"SB x UTG", col:0, row:2},
  {name:"BTN x CO", col:1, row:2},
  {name:"IP x HJ", col:2, row:2},
  {name:"IP x UTG", col:3, row:2}
];

let hero = null;
let villain = null;

const chart = document.getElementById("chart");
const rangeTitle = document.getElementById("rangeTitle");
const status = document.getElementById("status");
const tableCenter = document.getElementById("tableCenter");

function setChart(item) {
  const x = item.col * 100 / 3;
  const y = item.row * 100 / 2;

  chart.style.backgroundPosition = `${x}% ${y}%`;
}

function findChart(heroPosition, villainPosition) {

  const pair = [heroPosition, villainPosition];

  const mappings = {
    "BB|SB": "BB x SB",
    "BB|BTN": "BB x BTN",
    "BB|CO": "BB x CO",
    "BB|HJ": "BB x HJ",
    "BB|UTG": "BB x UTG",

    "SB|BTN": "SB x BTN",
    "SB|CO": "SB x CO",
    "SB|HJ": "SB x HJ",
    "SB|UTG": "SB x UTG",

    "BTN|CO": "BTN x CO",

    "HJ|IP": "IP x HJ",
    "UTG|IP": "IP x UTG"
  };

  const key = pair.sort().join("|");
  const chartName = mappings[key];

  if (!chartName) {
    return null;
  }

  return charts.find(c => c.name === chartName);
}

function updateSeats() {

  document.querySelectorAll(".seat").forEach(seat => {

    const position = seat.dataset.seat;
    const small = seat.querySelector("small");

    seat.classList.remove("hero", "villain");
    small.textContent = "";

    if (position === hero) {
      seat.classList.add("hero");
      small.textContent = "HERO";
    }

    if (position === villain) {
      seat.classList.add("villain");
      small.textContent = "VILÃO";
    }

  });
}

function updateDisplay() {

  updateSeats();

  if (!hero) {
    rangeTitle.textContent = "Selecione as posições";
    status.textContent = "Toque primeiro na posição Hero";

    tableCenter.innerHTML = "SELECIONE<br>HERO E VILÃO";
    return;
  }

  if (!villain) {
    rangeTitle.textContent = hero + " — Hero";
    status.textContent = "Agora toque na posição do Vilão";

    tableCenter.innerHTML = "HERO:<br>" + hero;
    return;
  }

  rangeTitle.textContent = hero + " vs " + villain;
  tableCenter.innerHTML =
    "HERO: " + hero + "<br>VILÃO: " + villain;

  const item = findChart(hero, villain);

  if (item) {
    setChart(item);
    status.textContent = "Confronto identificado";
  } else {
    status.textContent =
      "Este confronto ainda não possui tabela configurada";
  }
}

document.querySelectorAll(".seat").forEach(seat => {

  seat.addEventListener("click", () => {

    const position = seat.dataset.seat;

    if (!hero) {
      hero = position;
      villain = null;
    }

    else if (!villain) {

      if (position === hero) {
        hero = null;
        villain = null;
      } else {
        villain = position;
      }

    }

    else {
      hero = position;
      villain = null;
    }

    updateDisplay();

  });

});

function clearSelection() {
  hero = null;
  villain = null;
  updateDisplay();
}

updateDisplay();

</script>

</body>
</html>
